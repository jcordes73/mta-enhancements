# Static console + /api reverse proxy. Mirrors the vite dev proxy
# (vite.config.ts): '/api' prefix stripped, proxied to the hub-backend
# root path '/' — so the backend needs no CORS configuration.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://hub-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (the console is hash-routed; this just serves index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

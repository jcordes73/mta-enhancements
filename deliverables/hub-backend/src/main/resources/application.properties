# Tackle Hub API backend — MTA workspace implementation (contract v2.1)

# ---------------------------------------------------------------------------
# Datasource: PostgreSQL (DevServices starts a podman/docker container in dev
# and test automatically; %prod expects real connection env vars).
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.active=true

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.root-path=/
quarkus.http.port=8080
quarkus.http.non-application-root-path=q

# OpenAPI served at the upstream-conventional /openapi3.json
quarkus.smallrye-openapi.path=/openapi3.json
quarkus.smallrye-openapi.info-title=Tackle Hub API
quarkus.smallrye-openapi.info-version=2.1.0
quarkus.smallrye-openapi.info-description=The supported, versioned contract for driving MTA programmatically. \
Unauthenticated calls return 401 with WWW-Authenticate; mutations send ETag and honor If-Match; \
error bodies carry stable machine-readable codes. Breaking changes are announced one minor ahead \
with an N-1 compatibility window (deprecation policy).
quarkus.smallrye-openapi.info-terms-of-service=https://konveyor.github.io/tackle2-hub/

# ---------------------------------------------------------------------------
# Auth: Keycloak (OIDC) everywhere — dev, test, and prod. The checked-in
# realm (keycloak/mta-realm.json) defines the `mta` realm, the `mta-console`
# (public, SPA) and `mta-hub` (resource server) clients, the six console
# roles, and the demo users. Dev Services for Keycloak boots Keycloak on
# :8180 with that realm automatically in dev and test and injects the
# auth-server-url; %prod points at a real Keycloak via KEYCLOAK_URL.
# Unauthenticated calls return 401 + WWW-Authenticate, never a redirect.
# The former header-based dev identity (DevIdentity) was removed — see
# git history / AGENTS.md for the migration notes.
# ---------------------------------------------------------------------------
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:https://keycloak.example.com/realms/mta}
%prod.quarkus.oidc.client-id=mta-hub
%dev.quarkus.oidc.client-id=mta-hub
%test.quarkus.oidc.client-id=mta-hub
quarkus.keycloak.devservices.realm-path=keycloak/mta-realm.json
quarkus.keycloak.devservices.port=8180
%prod.quarkus.keycloak.devservices.enabled=false
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# The OpenAPI document and health root stay public:
quarkus.http.auth.permission.public.paths=/openapi3.json,/q/*
quarkus.http.auth.permission.public.policy=permit


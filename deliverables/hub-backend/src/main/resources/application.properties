# Automation identity (one service account per pipeline, least-privilege):
hub.role-mapping.pipeline=applications:read,applications:create,applications:update,analyses:read,analyses:create,tasks:read,incidents:read,triage:read,triage:write,tags:read,business-services:read

# Claim that carries the subject's tenancy (organization id; a team claim may
# narrow it further). Keycloak realm must map these into the token.
hub.tenant.organization-claim=organization
hub.tenant.team-claim=team
hub.tenant.platform-admin-role=padmin

# Seed sample data on first boot (mirrors the mock's two organizations).
hub.seed.enabled=true

# Test profile: fresh schema + seed per test-JVM for deterministic runs.
%test.quarkus.hibernate-orm.database.generation=drop-and-create

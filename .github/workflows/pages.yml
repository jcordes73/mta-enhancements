name: Deploy GitHub Pages

# Publishes the shareable web artifacts on every push to main:
#   /mock/          — the PatternFly 6 console mock (single-file, deep-linkable)
#   /presentations/ — the five socialization decks + launcher
# The site is assembled from the repo sources; nothing is hand-edited here.
# One-time enablement: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site/mock site/presentations
          cp deliverables/ui-mockup/index.html site/mock/index.html
          cp -r socialization/presentations/. site/presentations/
          cp .github/pages/index.html site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

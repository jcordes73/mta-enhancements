name: Deploy GitHub Pages

# Publishes the shareable web artifacts on every push to main:
#   /mock/          — the PatternFly 6 console mock (single-file, deep-linkable)
#   /presentations/ — the five socialization decks + launcher
# The site is assembled from the repo sources; nothing is hand-edited here.
# One-time enablement: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Row-246 (2026-11-24 deploy incident): a failed deploy attempt + re-run left two
      # artifacts named "github-pages" on the run and deploy-pages v4 refuses to pick
      # between them ("Multiple artifacts named..."). Delete artifacts from earlier
      # attempts so a re-run of this job always starts clean. Retried + non-fatal: the
      # Actions API was intermittently 5xx'ing that day (error_count: 10 in deploy-pages);
      # if a stale artifact does survive, deploy fails with the explicit duplicate error.
      - name: Remove stale artifacts from earlier attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(curl -sf --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              | jq -r '.artifacts[] | select(.name == "github-pages") | .id') || ids=""
          for id in $ids; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id") || code=000
              if [ "$code" = "204" ]; then echo "deleted stale artifact $id"; break; fi
              echo "delete $id got HTTP $code (try $i)"; sleep 5
            done
          done
          exit 0

      - name: Assemble site
        run: |
          mkdir -p site/mock site/presentations
          cp deliverables/ui-mockup/index.html site/mock/index.html
          cp -r socialization/presentations/. site/presentations/
          cp .github/pages/index.html site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
